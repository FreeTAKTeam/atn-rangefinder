[package]
name = "atn-domain"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "EPL-2.0"

[dependencies]
atn-protocol = { path = "../atn-protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"
