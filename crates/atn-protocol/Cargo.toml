[package]
name = "atn-protocol"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "EPL-2.0"
description = "Pure, defensive codecs for the documented ATN display protocol"

[dependencies]
crc32fast = "1.4"
flate2 = "1.0"
serde = { version = "1.0", features = ["derive"] }

[dev-dependencies]
serde_json = "1.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"
